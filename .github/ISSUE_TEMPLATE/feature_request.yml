name: Feature request
description: Something api-anything should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with a web app, and where does api-anything fall short today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
