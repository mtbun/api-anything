<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;background:#11111b;font-family:"SF Mono",Menlo,monospace;color:#cdd6f4}
.wrap{position:absolute;inset:0;padding:72px 88px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;
background:radial-gradient(1200px 500px at 85% -10%,rgba(137,180,250,.18),transparent 60%),radial-gradient(900px 400px at -10% 110%,rgba(166,227,161,.12),transparent 60%)}
h1{font-size:84px;margin:0;letter-spacing:-2px;color:#fff}
h1 span{color:#89b4fa}
p{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:36px;margin:18px 0 0;color:#bac2de;line-height:1.3}
.term{background:#1e1e2e;border:1px solid #313244;border-radius:14px;padding:26px 30px;font-size:24px;line-height:1.6;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.p{color:#a6e3a1}.c{color:#6c7086}.k{color:#89b4fa}.s{color:#f9e2af}
.foot{display:flex;justify-content:space-between;font-size:21px;color:#7f849c;white-space:nowrap}
</style></head><body><div class="wrap">
<div><h1>api-<span>anything</span></h1><p>Turn any web app into an API that AI agents and scripts can call.</p></div>
<div class="term">
<div><span class="p">$</span> api-anything record https://app.example.com</div>
<div><span class="p">$</span> api-anything ops openapi.json</div>
<div><span class="p">$</span> api-anything call openapi.json <span class="k">getOrder</span> --orderId <span class="s">1042</span></div>
</div>
<div class="foot"><span>record · OpenAPI · verify · call · TypeScript &amp; Python clients</span><span>MIT · open source</span></div>
</div></body></html>
